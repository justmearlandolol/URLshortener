<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrlShortener</title>
    <style>
        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --text: #111111;
            --text-muted: #666666;
            --border: #e5e5e5;
            --accent: #111111;
            --accent-hover: #333333;
            --success: #16a34a;
            --error: #dc2626;
            --radius: 8px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            padding: 60px 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 540px;
        }

        header {
            margin-bottom: 32px;
            text-align: center;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="url"] {
            flex: 1;
            padding: 12px 14px;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            transition: border-color 0.2s;
            background: var(--bg);
        }

        input[type="url"]:focus {
            border-color: var(--accent);
            background: var(--surface);
        }

        button {
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: inherit;
            color: #ffffff;
            background-color: var(--accent);
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-msg {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }

        .history-section {
            margin-top: 32px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-header h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .clear-btn {
            background: none;
            color: var(--text-muted);
            padding: 4px 8px;
            font-size: 0.8rem;
        }

        .clear-btn:hover {
            background: #eeeeee;
            color: var(--text);
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .link-details {
            overflow: hidden;
        }

        .short-url {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text);
            text-decoration: none;
            display: block;
            margin-bottom: 2px;
        }

        .short-url:hover {
            text-decoration: underline;
        }

        .original-url {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .copy-btn {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 14px;
            font-size: 0.85rem;
        }

        .copy-btn:hover {
            background: #eeeeee;
        }

        .copy-btn.copied {
            background: var(--success);
            color: #ffffff;
            border-color: var(--success);
        }

        @media (max-width: 480px) {
            .input-group {
                flex-direction: column;
            }

            .link-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .copy-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>UrlShortener</h1>
            <p>Clean, simple, and distraction-free URL shortening.</p>
        </header>

        <main>
            <div class="card">
                <form id="shorten-form" novalidate>
                    <div class="input-group">
                        <input type="url" id="url-input" placeholder="Paste a long URL (e.g., https://example.com)"
                            required autocomplete="off">
                        <button type="submit" id="submit-btn">Shorten</button>
                    </div>
                    <p class="error-msg" id="error-msg"></p>
                </form>
            </div>

            <section class="history-section" id="history-section" style="display: none;">
                <div class="history-header">
                    <h2>Recent Links</h2>
                    <button type="button" class="clear-btn" id="clear-btn">Clear all</button>
                </div>
                <div class="link-list" id="link-list"></div>
            </section>
        </main>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
